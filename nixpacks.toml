[phases.setup]
nixPkgs = ['php84', 'php84Extensions.mbstring', 'php84Extensions.pdo', 'php84Packages.composer', 'nodejs']

[phases.install]
cmds = [
  'composer install --no-dev --optimize-autoloader --no-scripts --ignore-platform-reqs'
]

[phases.build]
cmds = ['php artisan config:cache']

[start]
cmd = 'php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}'
