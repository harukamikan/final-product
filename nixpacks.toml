# Force cache clear - 2026-01-09

[phases.setup]
nixPkgs = ["php83", "php83Extensions.mbstring", "php83Extensions.pdo", "php83Extensions.pdo_mysql", "php83Extensions.gd", "php83Packages.composer", "nodejs"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-scripts --ignore-platform-req=ext-gd",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan config:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
